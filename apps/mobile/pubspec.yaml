name: aerogaze_mobile
description: Aplicativo de campo AeroGaze AI para o MVP do hackathon.
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: ^3.12.2

dependencies:
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  uuid: ^4.6.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.15.1

flutter:
  default-flavor: dev
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/reference/
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
